name: MenuBarTodo
configFiles:
  Debug: Config.xcconfig
  Release: Config.xcconfig
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_HARDENED_RUNTIME: YES
packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: 7.0.0
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: 2.0.0
targets:
  TodoCore:
    type: framework
    platform: macOS
    sources: [Core]
    dependencies:
      - package: GRDB
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(LF_BUNDLE_ID).core"
        GENERATE_INFOPLIST_FILE: YES
  MenuBarTodo:
    type: application
    platform: macOS
    sources: [App]
    dependencies:
      - target: TodoCore
      - package: KeyboardShortcuts
      - package: GRDB
    info:
      path: App/Info.plist
      properties:
        LSUIElement: true
        CFBundleDisplayName: Laser Focus
        CFBundleName: Laser Focus
        CFBundleShortVersionString: "0.2.0"
        CFBundleVersion: "1"
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: ""
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    entitlements:
      path: App/MenuBarTodo.entitlements
      properties:
        com.apple.security.network.client: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(LF_BUNDLE_ID)"
        PRODUCT_NAME: Laser Focus
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  TodoCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests]
    dependencies:
      - target: TodoCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(LF_BUNDLE_ID).tests"
        GENERATE_INFOPLIST_FILE: YES
schemes:
  MenuBarTodo:
    build:
      targets:
        MenuBarTodo: all
        TodoCoreTests: [test]
    test:
      targets: [TodoCoreTests]
